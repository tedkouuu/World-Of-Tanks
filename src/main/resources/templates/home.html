<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Battle — World of Tanks</title>
    <th:block th:replace="~{fragments/head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
<header th:include="~{fragments/navigation :: navigation}"></header>
<main role="main">
    <div class="battle-arena">

        <div class="hero-intro">
            <h1 class="battle-title">
                <span class="title-line" th:text="#{battle_title_1}">Choose Your</span>
                <span class="title-highlight" th:text="#{battle_title_2}">Battlefield</span>
            </h1>
            <p class="battle-subtitle" th:text="#{battle_subtitle}">Select your tanks and launch the attack</p>
            <div class="title-divider"></div>
        </div>

        <form th:action="@{/tanks/battle}"
              th:method="post"
              th:object="${tankAttackDTO}"
              class="battle-form">

            <div class="battle-card attacker-card">
                <div class="card-glow attacker-glow"></div>
                <div class="card-badge attacker-badge">ATK</div>
                <div class="card-image-wrap">
                    <img class="card-tank-img"
                         th:src="@{/images/tank-attacker.jpg}"
                         alt="Attacker tank">
                    <div class="img-overlay attacker-overlay"></div>
                </div>
                <div class="card-content">
                    <span class="card-role attacker-role" th:text="#{battle_attacker}">Attacking Tank</span>
                    <h3 class="card-heading" th:text="#{battle_select_attacker}">Select the attacker</h3>
                    <p class="card-desc" th:text="#{battle_attacker_desc}">Choose your strongest tank</p>
                    <select class="tank-select attacker-select"
                            th:field="*{attackerId}" th:onchange="changeImgOfTank(this)">
                        <option value="0" selected th:text="#{battle_my_tanks}">My tanks</option>
                        <option th:each="tank : ${ownTanks}" th:value="${tank.getId()}"
                                th:text="${tank.user.getFullName()} + ' - ' + ${tank.getName()}"></option>
                    </select>
                </div>
            </div>

            <div class="vs-section">
                <div class="vs-line"></div>
                <div class="vs-badge">
                    <span class="vs-text">VS</span>
                </div>
                <div class="vs-line"></div>
            </div>

            <div class="battle-card defender-card">
                <div class="card-glow defender-glow"></div>
                <div class="card-badge defender-badge">DEF</div>
                <div class="card-image-wrap">
                    <img class="card-tank-img"
                         th:src="@{/images/tank-defender.jpg}"
                         alt="Defender tank">
                    <div class="img-overlay defender-overlay"></div>
                </div>
                <div class="card-content">
                    <span class="card-role defender-role" th:text="#{battle_defender}">Defending Tank</span>
                    <h3 class="card-heading" th:text="#{battle_select_defender}">Select the defender</h3>
                    <p class="card-desc" th:text="#{battle_defender_desc}">Pick your enemy target</p>
                    <select class="tank-select defender-select"
                            th:field="*{defenderId}" th:onchange="changeImgOfTank(this)">
                        <option value="0" selected th:text="#{battle_enemy_tanks}">Enemy tanks</option>
                        <option th:each="tank : ${enemyTanks}" th:value="${tank.id}"
                                th:text="${tank.user.getFullName()} + ' - ' + ${tank.getName()}"></option>
                    </select>
                </div>
            </div>

            <div class="attack-section">
                <button class="attack-btn" type="submit">
                    <span class="btn-text" th:text="#{battle_attack}">Launch Attack</span>
                    <span class="btn-icon">&#9876;</span>
                </button>
                <div class="attack-glow"></div>
            </div>

        </form>
    </div>
</main>
<th:block th:replace="~{fragments/footer}"/>
</body>
</html>
