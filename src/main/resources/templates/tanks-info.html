<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{tanks_info_title} + ' — World of Tanks'">Tank Archive — World of Tanks</title>
    <th:block th:replace="~{fragments/head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/tanks-info.css}">
</head>
<body>

<header th:include="~{fragments/navigation}"></header>

<div class="container tanks-container">
    <div class="tanks-header">
        <h1 th:text="#{tanks_info_title}">Tank Archive</h1>
        <p class="tanks-subtitle" th:text="#{tanks_subtitle}">Browse our complete collection of armored vehicles</p>
    </div>

    <div id="tanksContainer" class="tanks-grid">

        <th:block th:each="tank : ${allTanks}">
            <div class="tank-card">
                <a th:href="@{'/tanks/details/' + ${tank.id}}" class="tank-card-link">
                    <div class="tank-card-img">
                        <img th:src="@{/images/tank-defender.jpg}" alt="Tank image">
                        <div class="tank-card-category" th:if="${tank.categoryName}">
                            <span th:text="${tank.categoryName}">HEAVY_TANK</span>
                        </div>
                    </div>
                    <div class="tank-card-body">
                        <h3 class="tank-card-title" th:text="${tank.name}">Tiger I</h3>
                        <div class="tank-card-stats">
                            <div class="tank-stat">
                                <i class="fas fa-heart"></i>
                                <span th:text="${tank.health}">1200</span>
                            </div>
                            <div class="tank-stat">
                                <i class="fas fa-bolt"></i>
                                <span th:text="${tank.power}">450</span>
                            </div>
                        </div>
                        <div class="tank-card-owner">
                            <i class="fas fa-user"></i>
                            <span th:text="${tank.ownerUsername}">admin</span>
                        </div>
                    </div>
                </a>
                <div class="tank-card-actions" sec:authorize="isAuthenticated()">
                    <a th:href="@{'/tanks/edit/' + ${tank.id}}" class="action-btn action-edit">
                        <i class="fas fa-edit"></i>
                    </a>
                    <form th:action="@{'/tanks/delete/' + ${tank.id}}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="action-btn action-delete"
                                onclick="return confirm('Are you sure?');">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </form>
                </div>
            </div>
        </th:block>
    </div>

    <div class="tanks-empty" th:if="${allTanks.size() == 0}">
        <i class="fas fa-tank fa-3x"></i>
        <h3 th:text="#{tanks_no_tanks}">There are no tanks to show</h3>
    </div>

    <div id="pagination" class="pagination"></div>
</div>

<script th:src="@{/js/pagination.js}"></script>
<th:block th:include="~{fragments/footer}"/>
</body>
</html>
