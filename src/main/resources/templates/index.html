<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>World of Tanks</title>
    <th:block th:replace="~{fragments/head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/index.css}">
</head>
<body>
<header th:include="~{fragments/navigation}"></header>

<div class="masthead">
    <div class="overlay"></div>
    <div class="container h-100 d-flex align-items-center justify-content-center">
        <div class="text-center hero-card">
            <h1 class="text-uppercase text-white font-weight-bold" th:text="#{landing_title}">World of Tanks</h1>
            <p class="text-faded mt-4" th:text="#{landing_subtitle}">Welcome, please register to start your journey!</p>
            <div class="cta-group">
                <a class="btn btn-primary btn-lg mt-3" href="/users/register" role="button" th:text="#{landing_register}">Register</a>
                <a class="btn btn-outline-light btn-lg mt-3" href="/users/login" role="button" th:text="#{landing_login}">Login</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
