<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Search — World of Tanks</title>
    <th:block th:replace="~{fragments/head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/search.css}">
</head>

<body>
<header th:include="~{fragments/navigation}"></header>

<div class="container">
    <h2 id="searchH2" class="text-center text-white" th:text="#{search_title}">Search for tanks</h2>

    <form id="searchForm"
          th:method="GET"
          th:action="@{/tanks/search}"
          th:object="${searchTankDTO}"
          class="form-inline justify-content-center">

        <input
                th:field="*{name}"
                class="form-control mr-sm-2 mb-2"
                type="search"
                th:placeholder="#{search_name}"
                aria-label="Search by name"/>

        <input
                th:field="*{health}"
                class="form-control mr-sm-2 mb-2"
                type="search"
                th:placeholder="#{search_health}"
                aria-label="Search by health"/>

        <input
                th:field="*{power}"
                class="form-control mr-sm-2 mb-2"
                type="search"
                th:placeholder="#{search_power}"
                aria-label="Search by power"/>

        <div class="d-flex justify-content-center w-100 mt-3">
            <button class="btn btn-lg btn-primary w-50" type="submit">
                <span th:text="#{search_submit}">Search</span> <img id="searchIcon" th:src="@{/images/search-icon.png}" alt="Search icon">
            </button>
        </div>
    </form>
</div>

<div class="search-results-grid mt-5" style="max-width: 1100px; margin: 2rem auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; padding: 0 1rem;">
    <th:block th:each="tank : ${tanks}">
        <a th:href="@{'/tanks/details/' + ${tank.id}}" class="search-result-card" style="background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; text-decoration: none; transition: all 0.3s ease;">
            <div style="height: 160px; overflow: hidden;">
                <img th:src="@{/images/tank-defender.jpg}" alt="Tank" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <div style="padding: 1rem 1.25rem;">
                <h4 style="font-size: 1.05rem; color: #fff; margin-bottom: 0.5rem;" th:text="${tank.name}">Tank</h4>
                <div style="display: flex; gap: 1rem; font-size: 0.85rem; color: var(--text-secondary);">
                    <span><i class="fas fa-heart" style="color: var(--success);"></i> <span th:text="${tank.health}">800</span></span>
                    <span><i class="fas fa-bolt" style="color: var(--accent);"></i> <span th:text="${tank.power}">350</span></span>
                </div>
            </div>
        </a>
    </th:block>
</div>
<h3 th:if="${tanks != null and #lists.isEmpty(tanks)}" class="text-center mt-4" style="color: var(--text-secondary);" th:text="#{search_no_results}">
    There are no tanks with this name yet.
</h3>

<th:block th:include="~{fragments/footer}"/>

</body>
</html>
