<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 — Forbidden</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            background: #0b0f19;
            color: #eaeaea;
            text-align: center;
            padding: 2rem;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(30,60,114,0.12) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 20%, rgba(230,57,70,0.06) 0%, transparent 55%);
            pointer-events: none;
        }
        .error-container {
            position: relative;
            z-index: 1;
            max-width: 480px;
        }
        .error-code {
            font-family: 'Montserrat', sans-serif;
            font-size: 7rem;
            font-weight: 800;
            color: #e63946;
            line-height: 1;
            text-shadow: 0 4px 20px rgba(230,57,70,0.3);
        }
        .error-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 1rem 0 0.75rem;
            color: #fff;
        }
        .error-text {
            color: rgba(255,255,255,0.6);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .error-link {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: #e63946;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .error-link:hover {
            background: #c1121f;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(230,57,70,0.3);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">403</div>
        <h1 class="error-title">Access Forbidden</h1>
        <p class="error-text">You don't have permission to access this resource. Nice try!</p>
        <a href="/" class="error-link">Go Home</a>
    </div>
</body>
</html>
