      <stop offset="0%" stop-color="#1b2026"/>
      <stop offset="100%" stop-color="#0f1216"/>
    </linearGradient>
    <linearGradient id="defender-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4dabf7"/>
